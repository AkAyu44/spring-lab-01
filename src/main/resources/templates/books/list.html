<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
<h1>Catalogue</h1>
<table class="books">
    <tr><th>#</th><th>Title</th><th>Author</th><th>Year</th></tr>
    <tr th:each="b : ${books}">
        <td th:text="${b.id}">1</td>
        <td th:text="${b.title}">Effective Java</td>
        <td th:text="${b.author}">Joshua Bloch</td>
        <td th:text="${b.year}">2018</td>
    </tr>
</table>
</main>
</body>
</html>
